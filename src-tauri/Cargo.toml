[package]
name = "kandy"
version = "0.12.0"
description = "Kandy"
authors = ["cjpais"]
edition = "2021"
license = "MIT"
default-run = "kandy"

[profile.dev]
incremental = true # Compile your binary in smaller steps.

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix keeps the lib name distinct from the bin name.
name = "kandy_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
serde_json = "1"
serde = { version = "1", features = ["derive"] }

[dependencies]
tauri = { version = "2.11.5", features = [
  "protocol-asset",
  "macos-private-api",
  "tray-icon",
  'image-png',
] }
tauri-plugin-log = "2.7.1"
tauri-plugin-opener = "2.5.2"
tauri-plugin-store = "2.4.1"
tauri-plugin-os = "2.3.2"
tauri-plugin-clipboard-manager = "2.3.2"
tauri-plugin-macos-permissions = "2.3.0"
tauri-plugin-process = "2.3.1"
rusqlite_migration = "2.3"
tauri-plugin-fs = "2.4.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
cpal = "0.16.0"
# Wait-free SPSC ring so the cpal input callback never allocates or locks.
rtrb = "0.4.0"
# Alternative pure-Rust VAD backend alongside Silero.
earshot = "1.2.2"
anyhow = "1.0.95"
rubato = "0.16.2"
hound = "3.5.1"
# Decode audio files the user drops on (or uploads to) the meeting tab.
# The feature set is the source of truth for the extension filter in
# `MeetingSettings.tsx` — keep the two in sync when changing it.
#
# Formats:  isomp4 (mp4/m4a/m4b/m4r/m4p/m4v/mov), wav, aiff, caf, ogg,
#           flac and mp3/aac elementary streams.
# Codecs:   aac, alac, flac, mp3, pcm, adpcm, vorbis.
#
# `mkv` is deliberately left out (its audio is usually Opus, which Symphonia
# cannot decode), and so are the Opus/Speex Ogg mappings, for the same reason.
# `pcm`/`ogg`/`vorbis` currently also arrive via rodio's own Symphonia
# features; they are listed here so our decoding does not silently depend on
# what another crate happens to turn on.
symphonia = { version = "0.5", default-features = false, features = [
    "aac",
    "adpcm",
    "aiff",
    "alac",
    "caf",
    "flac",
    "isomp4",
    "mp3",
    "ogg",
    "pcm",
    "vorbis",
    "wav",
] }
log = "0.4.25"
env_filter = "0.1.0"
tokio = "1.43.0"
vad-rs = { git = "https://github.com/cjpais/vad-rs", default-features = false }
enigo = "0.6.1"
rodio = { git = "https://github.com/cjpais/rodio.git" }
reqwest = { version = "0.12", features = ["json", "stream", "gzip", "brotli", "deflate"] }
futures-util = "0.3"
rustfft = "6.4.0"
strsim = "0.11.0"
natural = "0.5.0"
regex = "1"
chrono = "0.4"
rusqlite = { version = "0.37", features = ["bundled"] }
sha2 = "0.10"
# Whisper-family models run through transcribe-cpp (GGUF/ggml, native backends).
# The Metal backend feature is added in the macOS target table.
transcribe-cpp = { version = "0.2.3", default-features = false }
handy-keys = "0.3.4"
clap = { version = "4", features = ["derive"] }
specta = "=2.0.0-rc.22"
specta-typescript = "0.0.9"
tauri-specta = { version = "=2.0.0-rc.21", features = ["derive", "typescript"] }
tauri-plugin-dialog = "2.6"
hf-hub = { git = "https://github.com/cjpais/hf-hub", branch = "cancellable-downloads", features = [
  "tokio",
] }

[target.'cfg(unix)'.dependencies]
signal-hook = "0.3"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-autostart = "2.5.1"
tauri-plugin-single-instance = "2.3.2"

[target.'cfg(target_os = "macos")'.dependencies]
tauri-nspanel = { git = "https://github.com/ahkohd/tauri-nspanel", branch = "v2.1" }
transcribe-cpp = { version = "0.2.3", default-features = false, features = ["metal"] }
# Carbon-backed global shortcuts: only the macOS Secure Input fallback uses
# them (handy-keys' event tap goes blind while secure input is held).
tauri-plugin-global-shortcut = "2.3.1"
# SMAppService login item (autostart.rs).
objc2 = "0.6"
objc2-service-management = "0.3.2"

# TEMPORARY: tao pinned past 0.35.3 for the Wayland client-side-decorations fix
# (tao #1218, fixes tauri #11856 — dead titlebar buttons after visible(false) →
# show()). Drop this once a tao release containing it lands in tauri.
#
# The rev is a cjpais/tao branch, not upstream: dev past 0.35.3 also carries
# tao #1231 (removed window subclassing), which left the thread event target's
# WNDPROC falling through to DefSubclassProc. On a no-longer-subclassed window
# that returns 0, so WM_QUERYENDSESSION answered FALSE and vetoed Windows
# shutdown (Handy #1710). `handy` = 07f3742b + a cherry-pick of tao #1274
# (DefSubclassProc → DefWindowProcW). Repoint at upstream once #1274 merges.
#
# tao-macros is patched to the SAME rev so the lockfile carries a single
# tao-macros 0.1.3 source instead of a registry + git duplicate.
[patch.crates-io]
tao = { git = "https://github.com/cjpais/tao", rev = "c3bee28c1d446d95f08c95c3b6f8d4bde052b876" }
tao-macros = { git = "https://github.com/cjpais/tao", rev = "c3bee28c1d446d95f08c95c3b6f8d4bde052b876" }

[dev-dependencies]
tempfile = "3"
# Test-only tokio features for the local socket servers exercising the
# resumable HTTP downloader; normal builds keep the leaner feature set.
tokio = { version = "1.43.0", features = ["macros", "net", "io-util", "sync", "time", "rt-multi-thread"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "unwind"
